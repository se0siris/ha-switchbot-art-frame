delete_image:
  target:
    entity:
      integration: switchbot_art_frame
      domain: sensor
  fields:
    image:
      required: true
      example: oldest
      selector:
        select:
          custom_value: true
          options:
            - oldest
            - newest
            - current
            - first
            - last

download_image:
  target:
    entity:
      integration: switchbot_art_frame
      domain: sensor
  fields:
    image_id:
      required: true
      selector:
        number:
          min: 1
          max: 255
          mode: box
    show:
      required: false
      default: true
      selector:
        boolean:

upload_image:
  target:
    entity:
      integration: switchbot_art_frame
      domain: sensor
  fields:
    image_url:
      required: true
      selector:
        text:

show_image:
  target:
    entity:
      integration: switchbot_art_frame
      domain: sensor
  fields:
    image_url:
      required: false
      selector:
        text:
    image_path:
      required: false
      example: /config/www/frame/today.png
      selector:
        text:
    image_data:
      required: false
      selector:
        text:
          multiline: true
    make_room:
      required: false
      default: true
      selector:
        boolean:
