delete_image:
  target:
    entity:
      integration: switchbot_art_frame
      domain: sensor
  fields:
    image:
      required: true
      example: oldest
      selector:
        select:
          custom_value: true
          options:
            - oldest
            - newest
            - current
            - first
            - last

download_image:
  target:
    entity:
      integration: switchbot_art_frame
      domain: sensor
  fields:
    image_id:
      required: false
      selector:
        number:
          min: 1
          max: 255
          mode: box
    show:
      required: false
      default: true
      selector:
        boolean:
